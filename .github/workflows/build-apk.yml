name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build React production bundle
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://enagaze-com-backend.onrender.com
          REACT_APP_GOOGLE_CLIENT_ID: 564036796132-l4ojuk8un6ui6iepgu4ddjq322p8h4vl.apps.googleusercontent.com

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Engaze-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Engaze.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.version || 'v1.0.0' }}
          name: "Engaze Android App ${{ github.event.inputs.version || 'v1.0.0' }}"
          body: |
            ## 📱 Engaze Android App
            
            ### ✨ What's New:
            - **Google Sign-In**: Fixed authentication popup & account selection
            - **Native Mobile Experience**: 100dvh mobile dating UI (Tinder / Bumble style)
            - **Edge-to-Edge Chat**: Notch & safe-area navigation padding
            - **In-App Updates**: Automatic update notification for future releases
            - **Video Dating**: Real-time 1-on-1 video calling
            
            ### 📥 Download:
            Download **Engaze.apk** below to install directly on your Android phone.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/Engaze.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

