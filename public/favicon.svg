<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1020" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1B69" />
      <stop offset="50%" stop-color="#FD79A8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1F1D36" />
    </linearGradient>

    <!-- Left Figure / Violet Glow Gradient -->
    <linearGradient id="leftFigureGrad" x1="12" y1="12" x2="34" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A63F8" />
      <stop offset="40%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#4834D4" />
    </linearGradient>

    <!-- Right Figure / Pink-Coral Glow Gradient -->
    <linearGradient id="rightFigureGrad" x1="30" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FD79A8" />
      <stop offset="50%" stop-color="#FF5E7E" />
      <stop offset="100%" stop-color="#FF7675" />
    </linearGradient>

    <!-- Head Glow Gradients -->
    <linearGradient id="leftHeadGrad" x1="18" y1="13" x2="26" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A29BFE" />
      <stop offset="100%" stop-color="#6C5CE7" />
    </linearGradient>
    <linearGradient id="rightHeadGrad" x1="38" y1="15" x2="46" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAAA6" />
      <stop offset="100%" stop-color="#FF5E7E" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="28" y1="29" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F2F6" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background (with subtle border for contrast on light Google search tabs) -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Heart Base Glow & Figures -->
  <g filter="url(#glowFilter)">
    <!-- Left Violet Figure & Heart Half -->
    <path
      d="M22 23 C15 23 11 29 11 36 C11 44 21 50 32 55 C24 49 17 43 17 36 C17 31 20 27 25 27 C29 27 32 30 33 33 C31 27 28 23 22 23 Z"
      fill="url(#leftFigureGrad)"
    />

    <!-- Right Pink-Coral Figure & Heart Half -->
    <path
      d="M42 25 C48 25 53 30 53 37 C53 45 42 51 32 55 C40 50 47 44 47 37 C47 32 44 28 39 28 C35 28 32 31 31 34 C33 29 36 25 42 25 Z"
      fill="url(#rightFigureGrad)"
    />

    <!-- Connecting Intertwined Bottom Tip -->
    <path
      d="M28 50 C31 52 33 53 32 55 C31 53 29 52 28 50 Z"
      fill="#FD79A8"
    />

    <!-- Head / Avatar Glow Orbs -->
    <circle cx="22" cy="17" r="4.2" fill="url(#leftHeadGrad)" />
    <circle cx="42" cy="19" r="4.2" fill="url(#rightHeadGrad)" />

    <!-- Center Play Triangle (Video Connect Concept) -->
    <path
      d="M29 30.5 C29 29.5 30.1 28.9 31 29.4 L37.8 33.4 C38.6 33.9 38.6 35.1 37.8 35.6 L31 39.6 C30.1 40.1 29 39.5 29 38.5 Z"
      fill="url(#playGrad)"
      fill-opacity="0.95"
    />

    <!-- Top Left Sparkle -->
    <path
      d="M10 20 Q10 23 7 23 Q10 23 10 26 Q10 23 13 23 Q10 23 10 20 Z"
      fill="#FD79A8"
      opacity="0.8"
    />
  </g>
</svg>
