<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D17" />
    <meta
      name="description"
      content="Engaze is a modern dating platform for genuine singles. Discover compatible profiles, chat with mutual matches, and connect safely via 1-on-1 video dates."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.engaze.date/" />

    <!-- Engaze Brand Favicons (Google Search, Modern Browsers, & Apple Devices) -->

    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Facebook Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Engaze" />
    <meta property="og:title" content="Engaze — Dating Platform & Live 1-on-1 Video Connections" />
    <meta
      property="og:description"
      content="Engaze is a modern dating platform for genuine singles. Discover compatible profiles, chat with mutual matches, and connect safely via 1-on-1 video dates."
    />
    <meta property="og:url" content="https://www.engaze.date/" />
    <meta property="og:image" content="https://www.engaze.date/logo512.png" />

    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Engaze Dating and Live Video Brand Logo" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.engaze.date/" />
    <meta name="twitter:title" content="Engaze — Dating Platform & Live 1-on-1 Video Connections" />
    <meta
      name="twitter:description"
      content="Engaze is a modern dating platform for genuine singles. Discover compatible profiles, chat with mutual matches, and connect safely via 1-on-1 video dates."
    />
    <meta name="twitter:image" content="https://www.engaze.date/logo512.png" />
    <meta name="twitter:image:alt" content="Engaze Dating and Live Video Brand Logo" />

    <!-- JSON-LD Structured Data: Organization, WebSite & WebApplication Schemas -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.engaze.date/#organization",
          "name": "Engaze",
          "url": "https://www.engaze.date/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://www.engaze.date/#logo",
            "url": "https://www.engaze.date/logo512.png",
            "contentUrl": "https://www.engaze.date/logo512.png",
            "caption": "Engaze Brand Logo",
            "width": "512",
            "height": "512"
          },
          "image": "https://www.engaze.date/logo512.png",
          "description": "Engaze is an online dating platform connecting genuine singles through profile discovery cards, mutual chat, and 1-on-1 video dates."
        },
        {
          "@type": "WebSite",
          "@id": "https://www.engaze.date/#website",
          "name": "Engaze",
          "url": "https://www.engaze.date/",
          "publisher": {
            "@id": "https://www.engaze.date/#organization"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://www.engaze.date/#webapp",
          "name": "Engaze Dating Platform",
          "url": "https://www.engaze.date/",
          "applicationCategory": "DatingApplication",
          "operatingSystem": "All modern web browsers",
          "description": "Online dating application featuring compatible candidate discovery, instant messaging with mutual matches, and direct 1-on-1 live video calls."
        }
      ]
    }
    </script>

    <!-- Preconnect CDNs for Fonts & Hero Media -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Non-Render-Blocking Google Fonts Loading -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <!-- Preload Hero Showcase Image for Instant LCP -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=400&q=75"
      imagesrcset="https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=400&q=75 400w, https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=800&q=80 800w"
      imagesizes="(max-width: 600px) 360px, 400px"
