apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def versionFile = file('../../version.json')
def parsedVer = [versionCode: 4, versionName: "1.0.3"]
if (versionFile.exists()) {
    try {
        parsedVer = new JsonSlurper().parseText(versionFile.text)
    } catch (Exception ignored) {}
}

def appVersionCode = project.hasProperty('versionCode') ?
    project.property('versionCode').toInteger() :
    (parsedVer.versionCode ? parsedVer.versionCode.toInteger() : 4)

def appVersionName = project.hasProperty('versionName') ?
    project.property('versionName').toString() :
    (parsedVer.versionName ?: "1.0.3")

def signingProps = new Properties()
def envSigningFile = file('.env.signing')
if (envSigningFile.exists()) {
    envSigningFile.withInputStream { signingProps.load(it) }
}

def signingStoreFile = System.getenv("ENGAZE_KEYSTORE_PATH") ?:
    signingProps.getProperty("ENGAZE_KEYSTORE_PATH") ?:
    (file("engaze-release.jks").exists() ? "engaze-release.jks" : null)

def signingStorePassword = System.getenv("ENGAZE_KEYSTORE_PASSWORD") ?:
    signingProps.getProperty("ENGAZE_KEYSTORE_PASSWORD")

def signingKeyAlias = System.getenv("ENGAZE_KEY_ALIAS") ?:
    signingProps.getProperty("ENGAZE_KEY_ALIAS") ?: "engaze"

def signingKeyPassword = System.getenv("ENGAZE_KEY_PASSWORD") ?:
    signingProps.getProperty("ENGAZE_KEY_PASSWORD") ?: signingStorePassword

def hasPersistentSigning = signingStoreFile != null && file(signingStoreFile).exists() && signingStorePassword != null

android {
    namespace = "com.engaze.date"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.engaze.date"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasPersistentSigning) {
            persistent {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        debug {
            if (hasPersistentSigning) {
                signingConfig signingConfigs.persistent
            } else if (System.getenv("CI") == "true") {
                throw new GradleException("CI Build Error: Persistent signing configuration is missing. Ephemeral debug keystore fallback is forbidden in CI.")
            }
        }
        release {
            if (hasPersistentSigning) {
                signingConfig signingConfigs.persistent
            } else if (System.getenv("CI") == "true") {
                throw new GradleException("CI Build Error: Persistent signing configuration is missing for release build. Ephemeral fallback is forbidden in CI.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
